limit_req_zone $binary_remote_addr zone=join:10m rate=30r/m;

upstream lessons_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # ссылки учеников — без пароля, но с ограничением частоты
    location /j/ {
        limit_req zone=join burst=10 nodelay;
        proxy_pass http://lessons_app;
        proxy_set_header Host $host;
    }

    # всё остальное (админка, API, вход преподавателя) — по логину и паролю
    location / {
        auth_basic "Lessons admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://lessons_app;
        proxy_set_header Host $host;
    }
}
